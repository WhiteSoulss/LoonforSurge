name: Probe Loon plugin source access

on:
  push:
    paths:
      - .github/workflows/probe-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch one public plugin
        shell: bash
        run: |
          set -euo pipefail
          url="https://kelee.one/Tool/Loon/Lpx/Block_HTTPDNS.lpx"
          status="$(curl -L -sS --retry 1 --max-time 30 -o /tmp/probe.lpx -w '%{http_code}' "$url")"
          echo "HTTP status: $status"
          test "$status" = "200"
          bytes="$(wc -c < /tmp/probe.lpx)"
          echo "Bytes received: $bytes"
          test "$bytes" -gt 100
          grep -qE '^#![[:space:]]*name' /tmp/probe.lpx
          echo "Plugin header verified"
